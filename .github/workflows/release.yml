name: release

# Builds Windows/macOS binaries and publishes a GitHub Release v<__version__>.
# Runs automatically when a push to main bumps __version__ to a version that has
# no tag yet; can also be started from the Actions tab. Release notes come from
# the matching "## v<version>" section of CHANGELOG.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [logic.py, CHANGELOG.md, .github/workflows/release.yml]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          tag="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' logic.py)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already released, nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - run: pytest -q

      - run: pyinstaller Discrepancy_Finder.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          name="Discrepancy_Finder-${{ needs.version.outputs.tag }}-windows.exe"
          mv dist/Discrepancy_Finder.exe "$name"
          sha256sum "$name" > "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          name="Discrepancy_Finder-${{ needs.version.outputs.tag }}-macos-arm64.zip"
          ditto -c -k --keepParent "dist/Discrepancy Finder.app" "$name"
          shasum -a 256 "$name" > "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v tag="## $TAG" '$0 == tag {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## $TAG' section in CHANGELOG.md"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Discrepancy Finder ${{ env.TAG }}
          body_path: notes.md
          files: assets/*
