name: release

# Push a tag like v1.2.0 to build Windows/macOS binaries and publish a GitHub Release.
# Release notes are taken from the annotated tag message.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - name: Check tag matches __version__
        run: python -c "import logic, sys; sys.exit(0 if 'v' + logic.__version__ == '${{ github.ref_name }}' else 'tag ${{ github.ref_name }} != v' + logic.__version__)"

      - run: pytest -q

      - run: pyinstaller Discrepancy_Finder.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          name="Discrepancy_Finder-${{ github.ref_name }}-windows.exe"
          mv dist/Discrepancy_Finder.exe "$name"
          sha256sum "$name" > "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          name="Discrepancy_Finder-${{ github.ref_name }}-macos-arm64.zip"
          ditto -c -k --keepParent "dist/Discrepancy Finder.app" "$name"
          shasum -a 256 "$name" > "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read tag message
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" | sed '/-----BEGIN PGP/,$d' > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Discrepancy Finder ${{ github.ref_name }}
          body_path: notes.md
          files: assets/*
