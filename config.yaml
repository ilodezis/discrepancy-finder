# General settings
epsilon: 0.01  # Minimum difference to consider a discrepancy
log_path: "discrepancy_finder.log"  # Log file name, relative to the user's home folder

# What to do when the same ID appears in several rows of one file:
#   sum   - add the amounts up (split payments, several items per order)
#   first - keep only the first row
duplicate_ids: "sum"

excel:
  max_header_rows: 50  # Maximum rows to scan for header detection
  engine: null  # null = auto (openpyxl for .xlsx, xlrd for .xls)

# Column identification (case-insensitive).
# Exact matches win over partial ones, earlier entries win over later ones.
id_columns:
  - "идентификатор заказа"
  - "id заказа"
  - "номер заказа"
  - "order id"
  - "order no"

amount_columns:
  - "сумма"
  - "amount"

# Skip rows whose ID starts with these values (case-insensitive)
skip_rows:
  - "итого"
  - "всего"
  - "total"

# UI settings
window:
  width: 900
  height: 600

colors:
  window_background: "#F0F0F0"
  accent: "#FF0000"  # Selection highlight
